<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Health Record System - Register</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">

<!-- Google reCAPTCHA -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">
        <div class="col-12 d-flex align-items-center justify-content-center">
            <div class="registration-card">
                <div class="text-center mb-4">
                    <h2 class="registration-title">Create Your Account</h2>
                    <div class="registration-type">
                        <span class="type-label">Registering as:</span>
                        <span id="current-type" class="type-badge patient-type">Patient</span>
                    </div>
                </div>

                <div class="user-type-toggle mb-4 d-flex justify-content-center">
                    <button type="button" id="patient-btn" class="toggle-btn active">Patient</button>
                    <button type="button" id="doctor-btn" class="toggle-btn">Doctor</button>
                </div>

                <form id="registration-form">

                    <div class="form-group mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="fullName" placeholder="Dr. Jane Smith" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="doctor@hospital.com" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-phone"></i></span>
                            <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Google reCAPTCHA -->
                    <!-- <div class="mb-3">
                        <div class="g-recaptcha" data-sitekey="6LcMaQ0sAAAAAJKr81WPuTSZzJ4qRG8VKxBNE66K"></div>
                    </div> -->

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="#" class="terms-link">Privacy Policy</a> and 
                            <a href="#" class="terms-link">Terms of Service</a>
                        </label>
                    </div>

                    <div id="admin-notice" class="admin-notice mb-3" style="display: none;">
                        <i class="fas fa-info-circle"></i>
                        Doctor registrations require admin approval before access is granted.
                    </div>

                    <button type="submit" class="btn-submit w-100 mb-3" id="submit-btn">Create Patient Account</button>

                    <div class="text-center">
                        <span class="login-text">
                            Already have an account? 
                            <a href="/login" class="login-link">Login here</a>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Health Record System - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">
        <div class="col-12 d-flex align-items-center justify-content-center">
            <div class="login-card">
                <div class="text-center mb-4">
                    <h2 class="login-title">Login</h2>
                </div>

                <form id="login-form">
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="role-select" class="form-label">Login as</label>
                        <select class="form-select" id="role-select" required>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <!-- Google reCAPTCHA
                    <div class="mb-3">
                        <div class="g-recaptcha" data-sitekey="6LcMaQ0sAAAAAJKr81WPuTSZzJ4qRG8VKxBNE66K"></div>
                    </div> -->

                    <button type="submit" class="btn-submit w-100 mb-3">Login</button>
                    <div class="text-center">
                        <span class="login-text">
                            Don't have an account? <a href="/register" class="register-link">Register here</a>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/script.js"></script>
</body>
</html>
